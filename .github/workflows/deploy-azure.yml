name: Deploy to Azure Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_NAME }}.azurecr.io

jobs:
  build-and-deploy:
    name: Build Containers & Deploy to Azure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      # Build and push Backend Image
      - name: Build & Push Backend Image
        run: |
          docker build -t $ACR_LOGIN_SERVER/resume-backend:${{ github.sha }} -t $ACR_LOGIN_SERVER/resume-backend:latest ./backend
          docker push $ACR_LOGIN_SERVER/resume-backend:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/resume-backend:latest

      # Build and push Worker Image
      - name: Build & Push Worker Image
        run: |
          docker build -t $ACR_LOGIN_SERVER/resume-worker:${{ github.sha }} -t $ACR_LOGIN_SERVER/resume-worker:latest ./backend
          docker push $ACR_LOGIN_SERVER/resume-worker:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/resume-worker:latest

      # Build and push ML Service Image
      - name: Build & Push ML Service Image
        run: |
          docker build -t $ACR_LOGIN_SERVER/resume-ml:${{ github.sha }} -t $ACR_LOGIN_SERVER/resume-ml:latest ./ml-service
          docker push $ACR_LOGIN_SERVER/resume-ml:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/resume-ml:latest

      # Deploy Python ML Service to Azure Container Apps
      - name: Deploy ML Service to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}/ml-service
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: resume-ml-service
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/resume-ml:${{ github.sha }}

      # Deploy Node.js Backend to Azure App Service
      - name: Deploy Backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: resume-matcher-backend
          images: ${{ env.ACR_LOGIN_SERVER }}/resume-backend:${{ github.sha }}

      # Deploy React Frontend to Azure Static Web Apps
      - name: Deploy Frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/frontend'
          output_location: 'dist'

name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Test Backend & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Validate Syntax & Run Tests
        working-directory: backend
        run: |
          node --check src/server.js
          node --check src/app.js
          node --check src/workers/resume.worker.js
          npm test

  frontend-build:
    name: Build & Validate Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Type Check & Production Build
        working-directory: frontend
        run: npm run build

  ml-service-lint:
    name: Validate ML Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Import Check
        working-directory: ml-service
        run: |
          python -m py_compile main.py resume_parser.py text_processor.py skill_extractor.py resume_analyzer.py job_matcher.py

services:
  mongodb:
    image: mongo:7
    container_name: resume_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: resume_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: resume_ml_service
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ai_resume_job_matcher
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production_quality_super_secret_jwt_key_resume_matcher_2026
      - ML_SERVICE_URL=http://ml-service:8000
      - CLIENT_URL=*
    volumes:
      - uploads:/app/uploads
      - ./data:/data
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_worker
    restart: always
    command: ["npm", "run", "worker"]
    healthcheck:
      disable: true
    environment:
      - MONGO_URI=mongodb://mongodb:27017/ai_resume_job_matcher
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=production_quality_super_secret_jwt_key_resume_matcher_2026
    volumes:
      - uploads:/app/uploads
      - ./data:/data
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5001/api
    container_name: resume_frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - app-network
    depends_on:
      - backend

volumes:
  mongodb_data:
  redis_data:
  uploads:

networks:
  app-network:
    driver: bridge
